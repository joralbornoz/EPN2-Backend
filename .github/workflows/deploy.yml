name: Deploy Backend EPN2
on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y Push de Imágenes
        run: |
          # 1. Construcción forzando el nombre del proyecto como 'epn2'
          # Esto hace que las imágenes se llamen epn2-ventas-api, epn2-despachos-api, etc.
          docker compose -p epn2 build
          
          # 2. Listar imágenes para verificar (esto ayuda a ver si hubo algún cambio)
          docker images
          
          # 3. Etiquetado usando el nombre fijo 'epn2'
          docker tag epn2-ventas-api ${{ secrets.DOCKER_USERNAME }}/epn2-ventas:latest
          docker tag epn2-despachos-api ${{ secrets.DOCKER_USERNAME }}/epn2-despachos:latest
          docker tag epn2-mysql-db ${{ secrets.DOCKER_USERNAME }}/epn2-db:latest
          
          # 4. Publicación
          docker push ${{ secrets.DOCKER_USERNAME }}/epn2-ventas:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/epn2-despachos:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/epn2-db:latest

      - name: Desplegar en EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_EC2_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/epn2-backend
            cd ~/epn2-backend
            curl -L https://raw.githubusercontent.com/${{ github.repository_owner }}/EPN2-Backend/deploy/docker-compose.yml -o docker-compose.yml
            docker compose down || true
            docker compose pull
            docker compose up -d