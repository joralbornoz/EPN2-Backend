name: Deploy Backend EPN2
on:
  push:
    branches: [ "deploy" ] # RÚBRICA IE7: Activación automática

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y Push de Imágenes
        run: |
          # 1. Construcción (IE1)
          docker compose build
          
          # 2. Etiquetado (IE3)
          docker tag epn2-backend-ventas-api joralbornozm/epn2-ventas:latest
          docker tag epn2-backend-despachos-api joralbornozm/epn2-despachos:latest
          docker tag epn2-backend-mysql-db joralbornozm/epn2-db:latest
          
          # 3. Publicación (IE3)
          docker push joralbornozm/epn2-ventas:latest
          docker push joralbornozm/epn2-despachos:latest
          docker push joralbornozm/epn2-db:latest

      - name: Desplegar en EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_EC2_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/epn2-backend
            cd ~/epn2-backend
            # Descargamos el compose actualizado desde GitHub
            curl -L https://raw.githubusercontent.com/joralbornozm/EPN2-Backend/deploy/docker-compose.yml -o docker-compose.yml
            # Detenemos, bajamos imágenes de Docker Hub y levantamos
            docker compose down || true
            docker compose pull
            docker compose up -d