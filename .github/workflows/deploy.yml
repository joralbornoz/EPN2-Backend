name: Deploy Backend EPN2
on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y Push de Imágenes
        run: |
          # 1. Construcción (IE1)
          docker compose build
          
          # 2. Etiquetado (IE3: Validación en repo de imágenes)
          # Docker usa el nombre del repo (epn2-backend) como prefijo
          docker tag epn2-backend-ventas-api ${{ secrets.DOCKER_USERNAME }}/epn2-ventas:latest
          docker tag epn2-backend-despachos-api ${{ secrets.DOCKER_USERNAME }}/epn2-despachos:latest
          docker tag epn2-backend-mysql-db ${{ secrets.DOCKER_USERNAME }}/epn2-db:latest
          
          # 3. Publicación (IE3/IE7)
          docker push ${{ secrets.DOCKER_USERNAME }}/epn2-ventas:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/epn2-despachos:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/epn2-db:latest
        # ... (pasos anteriores de build y push) ...

      - name: Desplegar Backend en EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_EC2_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Crear carpeta del proyecto si no existe
            mkdir -p ~/epn2-backend
            cd ~/epn2-backend
            # Descargar el docker-compose.yml desde el repo (o puedes copiarlo vía SCP)
            curl -O https://raw.githubusercontent.com/joralbornoz/EPN2-Backend/deploy/docker-compose.yml
            # Bajar imágenes nuevas y levantar
            docker compose pull
            docker compose up -d