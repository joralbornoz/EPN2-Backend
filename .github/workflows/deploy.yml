name: Deploy Backend EPN2
on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build APIs y DB
        run: |
          # Construimos usando el docker-compose del repo
          docker compose build
          
          # Etiquetamos para Docker Hub usando tu secreto de usuario
          docker tag epn2-backend-ventas-api ${{ secrets.DOCKER_USERNAME }}/epn2-ventas:latest
          docker tag epn2-backend-despachos-api ${{ secrets.DOCKER_USERNAME }}/epn2-despachos:latest
          docker tag epn2-db ${{ secrets.DOCKER_USERNAME }}/epn2-db:latest
          
          # Subimos las 3 imágenes (Validación solicitada por el profe)
          docker push ${{ secrets.DOCKER_USERNAME }}/epn2-ventas:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/epn2-despachos:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/epn2-db:latest