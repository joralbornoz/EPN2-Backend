name: Deploy Backend EPN2

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build APIs y DB personalizada
        run: |
          # 1. Construimos las imágenes usando el docker-compose del repositorio
          # Esto valida el ítem IE1 de la rúbrica (Contenedorización)
          docker compose build
          
          # 2. Etiquetamos las imágenes para tu repositorio de Docker Hub (joralbornozm)
          # NOTA: Docker usa el nombre del repo en minúsculas como prefijo (epn2-backend-)
          
          docker tag epn2-backend-ventas-api ${{ secrets.DOCKER_USERNAME }}/epn2-ventas:latest
          docker tag epn2-backend-despachos-api ${{ secrets.DOCKER_USERNAME }}/epn2-despachos:latest
          
          # Importante: El servicio de la base de datos se llama mysql-db en el compose
          docker tag epn2-backend-mysql-db ${{ secrets.DOCKER_USERNAME }}/epn2-db:latest
          
          # 3. Subimos las 3 imágenes a docker hub
          # RÚBRICA IE3: Publicación en repositorio de imágenes
          docker push ${{ secrets.DOCKER_USERNAME }}/epn2-ventas:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/epn2-despachos:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/epn2-db:latest