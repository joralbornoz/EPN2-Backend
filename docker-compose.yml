version: '3.8'

services:
  mysql-db:
    image: joralbornozm/epn2-db:latest
    container_name: epn2-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: epn2_db
    networks:
      - epn2-network # Conectado al puente
    ports:
      - "3306:3306"
    volumes:
      - epn2_db_data:/var/lib/mysql

  ventas-api:
    image: joralbornozm/epn2-ventas:latest
    container_name: ventas-api
    restart: on-failure
    depends_on:
      - mysql-db
    networks:
      - epn2-network # Conectado al puente
    ports:
      - "8081:8081"

  despachos-api:
    image: joralbornozm/epn2-despachos:latest
    container_name: despachos-api
    restart: on-failure
    depends_on:
      - mysql-db
    networks:
      - epn2-network # Conectado al puente
    ports:
      - "8080:8080"

  epn2-frontend-app:
    image: joralbornozm/epn2-frontend:latest
    container_name: epn2-frontend-app
    restart: always
    ports:
      - "80:80"
    networks:
      - epn2-network # Conectado al puente
    depends_on:
      - ventas-api
      - despachos-api

# DEFINICIÓN DEL PUENTE (La red que los une)
networks:
  epn2-network:
    driver: bridge

volumes:
  epn2_db_data: